name: 触发私仓生成科学订阅页面

# 公仓无法被私仓 push 监听；此处在三个扩展脚本变更时远程触发 Private_proxy/index.yml
on:
  push:
    branches:
      - main
      - master
    paths:
      - "clashverge_extension_js.txt"
      - "clashverge_extension_set.txt"
      - "flclash_extension_js.txt"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: 触发 Private_proxy「生成科学订阅页面」
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ 缺少 secrets.PUBLIC_REPO_TOKEN（需对 Private_proxy 有 workflow 权限）"
            exit 1
          fi
          # repository_dispatch：私仓 index.yml 已监听 event_type
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/child9527/Private_proxy/dispatches" \
            -d '{"event_type":"public-extension-scripts-updated"}'
          echo "✅ 已发送 repository_dispatch -> child9527/Private_proxy"
