name: 公仓订阅删除 → 通知私仓

# 仅在公仓 pool 订阅文件被删除时通知 Private_proxy，避免私仓每次同步扫描公仓。
on:
  push:
    paths:
      - "pool/clash/**"
      - "pool/v2ray/**"

permissions:
  contents: read

jobs:
  notify-private:
    runs-on: ubuntu-latest
    # [skip ci] 等机器提交若不想连环，可在 commit message 判断；删除操作一般是人手或私仓对齐提交
    steps:
      - name: 检出（含上一提交以便 diff）
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 检测删除的 clash / v2ray 订阅并通知私仓
        env:
          # 需能对 Private_proxy 发 repository_dispatch（classic PAT 勾选 repo，或 fine-grained 含该私仓 Contents/Actions）
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${PRIVATE_REPO_TOKEN:-}" ]; then
            echo "❌ 公仓 secrets 缺少 PRIVATE_REPO_TOKEN，无法通知私仓"
            exit 1
          fi

          # 相对上一提交：只关心删除的订阅文件
          DELETED=$(git diff --name-only --diff-filter=D HEAD~1 HEAD 2>/dev/null || true)
          if [ -z "$DELETED" ]; then
            echo "无删除文件，跳过"
            exit 0
          fi

          CLASH_NAMES=()
          V2RAY_NAMES=()

          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              pool/clash/*)
                base=$(basename "$path")
                case "$base" in
                  *.yaml|*.yml)
                    name="${base%.*}"
                    CLASH_NAMES+=("$name")
                    echo "🗑️ clash: $name"
                    ;;
                esac
                ;;
              pool/v2ray/*)
                base=$(basename "$path")
                case "$base" in
                  *.txt)
                    name="${base%.*}"
                    V2RAY_NAMES+=("$name")
                    echo "🗑️ v2ray: $name"
                    ;;
                esac
                ;;
            esac
          done <<< "$DELETED"

          dispatch() {
            local event_type="$1"
            local names_csv="$2"
            [ -z "$names_csv" ] && return 0
            echo "→ repository_dispatch $event_type names=$names_csv"
            # client_payload 用 JSON 数组字符串
            payload=$(printf '%s' "$names_csv" | python3 -c 'import sys,json; print(json.dumps({"names":[x for x in sys.stdin.read().strip().split(",") if x]}))')
            curl -sS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${PRIVATE_REPO_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/child9527/Private_proxy/dispatches" \
              -d "{\"event_type\":\"${event_type}\",\"client_payload\":${payload}}"
            echo ""
          }

          if [ ${#CLASH_NAMES[@]} -gt 0 ]; then
            IFS=','; csv="${CLASH_NAMES[*]}"; unset IFS
            dispatch "public-clash-pool-deleted" "$csv"
          else
            echo "无 clash 删除"
          fi

          if [ ${#V2RAY_NAMES[@]} -gt 0 ]; then
            IFS=','; csv="${V2RAY_NAMES[*]}"; unset IFS
            dispatch "public-v2ray-pool-deleted" "$csv"
          else
            echo "无 v2ray 删除"
          fi
